[project]
name = "wt-diarize"
version = "0.2.0"
description = "Diarization sidecar behind the Diarizer trait (Spec 04)."
requires-python = ">=3.11,<3.12"
# Versions checked on October 5, 2026, on the owner's Windows PC (CPU torch).
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.20",
    "pyannote.audio>=4.0.7,<5",
    "soundfile>=0.13",
    "torch>=2.6",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
