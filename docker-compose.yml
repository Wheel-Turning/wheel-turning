services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dg
      POSTGRES_PASSWORD: dg
      POSTGRES_DB: dg
    ports: ["5432:5432"]
    volumes: ["dgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dg"]
      interval: 5s
      retries: 10
  diarize:
    build: ./sidecars/diarize
    profiles: ["sidecar"]
    ports: ["8090:8090"]
volumes:
  dgdata: {}
