{% extends "base.html" %}
{% block title %}Delete your questions · Wheel Turning{% endblock %}
{% block content %}
<div class="reading">
<h1>Delete all your questions?</h1>
<p>This deletes every question you have asked here, with its answer and your feedback. It cannot be undone.</p>
<form method="post" action="/about/delete-my-data" class="actions">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="confirm" value="yes">
  <button type="submit">Delete everything</button>
  <a class="button-link" href="/about#privacy">Cancel</a>
</form>
</div>
{% endblock %}
