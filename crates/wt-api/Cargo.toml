[package]
name = "wt-api"
description = "The Axum web app: routes, templates and invite auth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
askama = "0.16"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
async-trait = "0.1"
# The SES client uses rustls on ring, already in the tree for sqlx, rather than the default
# aws-lc, whose OpenSSL-licensed parts deny.toml does not allow.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-sdk-sesv2 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
axum.workspace = true
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
getrandom = "0.4"
hmac = "0.13"
regex = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.11"
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
wt-core.workspace = true
wt-dana.workspace = true
wt-db.workspace = true
wt-extract.workspace = true
wt-ml.workspace = true
wt-retrieve.workspace = true
wt-synth.workspace = true

[dev-dependencies]
wt-db = { workspace = true, features = ["test-support"] }
wt-registry.workspace = true
http-body-util.workspace = true
insta = "1"
tower.workspace = true
tracing-subscriber.workspace = true
