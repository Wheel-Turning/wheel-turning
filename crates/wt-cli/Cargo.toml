[package]
name = "wt-cli"
description = "The wt binary: commands and the worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "wt"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
wt-core.workspace = true
wt-db.workspace = true
wt-registry.workspace = true
wt-ingest.workspace = true
wt-asr.workspace = true
async-trait = "0.1"
# The audit reads the PC backups bucket (Spec 11, PB1.3) with rustls on ring, as wt-api's SES
# client does, and asks the crisis help links (PB3.4) over HTTPS.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
wt-segment.workspace = true
wt-extract.workspace = true
wt-index.workspace = true
wt-ml.workspace = true
wt-api.workspace = true
wt-eval.workspace = true
wt-retrieve.workspace = true
csv = "1"
toml = "1"
toml_edit = "0.25"
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
wt-db = { workspace = true, features = ["test-support"] }
wiremock = "0.6"
