[package]
name = "wt-cli"
description = "The wt binary: commands and the worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "wt"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
wt-core.workspace = true
wt-db.workspace = true
wt-registry.workspace = true
wt-ingest.workspace = true
wt-asr.workspace = true
wt-segment.workspace = true
wt-extract.workspace = true
toml = "1"
toml_edit = "0.23"
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
wt-db = { workspace = true, features = ["test-support"] }
wiremock = "0.6"
