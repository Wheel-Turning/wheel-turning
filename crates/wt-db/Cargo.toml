[package]
name = "wt-db"
description = "The sqlx connection pool, the migration runner, repositories and views."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Starts a throwaway pgvector Postgres in Docker for integration tests in this and other crates.
test-support = ["dep:testcontainers"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
wt-core.workspace = true
wt-registry.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
unicode-normalization = "0.1"
sqlx.workspace = true
thiserror.workspace = true
testcontainers = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time", "macros"] }
tracing.workspace = true

[dev-dependencies]
wt-db = { path = ".", features = ["test-support"] }
tokio.workspace = true
trybuild.workspace = true
