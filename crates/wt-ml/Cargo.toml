[package]
name = "wt-ml"
description = "The Embedder and Reranker traits and their ONNX Runtime implementations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
thiserror.workspace = true
tokio = { workspace = true }
sha2.workspace = true
# ONNX Runtime is loaded at run time from WT_ORT_DYLIB (or ORT_DYLIB_PATH), so nothing is
# downloaded at build time and CI builds without it. API 22 needs ONNX Runtime 1.22 or newer.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-22"] }
# Pure Rust: no oniguruma or C++ suffix-array builds.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
