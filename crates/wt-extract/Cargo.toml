[package]
name = "wt-extract"
description = "The LlmClient, extraction schemas, extraction and citation resolution."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
wt-core.workspace = true
wt-db.workspace = true
wt-segment.workspace = true
async-trait = "0.1"
# The SNS client uses rustls on ring, as wt-api's SES client does, rather than the default aws-lc.
# `sso` lets `wt alerts test` run with the owner's SSO profile.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "sso"] }
aws-sdk-sns = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "macros", "rt"] }
toml = "1"
tracing.workspace = true

[dev-dependencies]
wt-db = { workspace = true, features = ["test-support"] }
tokio.workspace = true
tracing-subscriber.workspace = true
wiremock = "0.6"
