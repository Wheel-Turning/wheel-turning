[package]
name = "wt-ingest"
description = "The SourceAdapter trait, the Vimeo adapter, deduplication and talk classification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
wt-asr.workspace = true
wt-segment.workspace = true
wt-extract.workspace = true
wt-index.workspace = true
wt-ml.workspace = true
fs4 = "0.13"
wt-core.workspace = true
wt-db.workspace = true
wt-registry.workspace = true
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
csv = "1"
tl = "0.7"
zip = { version = "9", default-features = false, features = ["deflate"] }
rss = { version = "2", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
toml = "1"
tracing.workspace = true
unicode-normalization = "0.1"
base64 = "0.22"
percent-encoding = "2"
url = "2"

[dev-dependencies]
wt-db = { workspace = true, features = ["test-support"] }
tokio.workspace = true
trybuild.workspace = true
wiremock = "0.6"
flate2 = "1"
