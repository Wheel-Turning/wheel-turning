# sentence here was written for the test; none comes from a tester. Spec 05 requires acute
# recall of 100 percent, distress recall of at least 90 percent, and fewer than 5 percent of
# ordinary practice questions flagged at any level.
#
# Ordinary questions deliberately include Zen language that mentions death, killing, pain and
# sickness, since those are the false alarms most likely in this collection.

