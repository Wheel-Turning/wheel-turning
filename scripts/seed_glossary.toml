# The glossary's starting terms (Spec 04, Glossary correction), loaded with
# `wt glossary import --file scripts/seed_glossary.toml --by "<name>"`. Safe to import again:
# variants merge, and a term spelled differently from the stored one is reported, not changed.
#
# Each term has a canonical spelling, a kind (term, name or text_title) and known variants:
# mis-hearings and alternate spellings, matched whole-word and ignoring case and punctuation.
# These variants are guesses to start from; grow the list from the near-miss suggestions the
# correct job writes, adding a variant only after seeing it in a transcript.

