# typos runs in CI. Words here are correct in this codebase.
[default]
# CSS unicode-range values such as U+0100-02BA, in site/styles.css
extend-ignore-re = ['U\+[0-9A-Fa-f]+(-[0-9A-Fa-f]+)?']

[default.extend-words]
# The EPUB package file (Open Packaging Format).
opf = "opf"
nd = "nd" # Creative Commons NoDerivatives, as in cc-by-nc-nd-4.0
mis = "mis" # "mis-hearings", in a merged migration that cannot be edited
pn = "pn" # P1..Pn, passage references
cleary = "cleary" # Thomas Cleary, translator
gya = "gya" # romanized Japanese, the Heart Sutra mantra "gya tei gya tei"
maka = "maka" # romanized Japanese, "maka hannya haramita" (Maha Prajna Paramita)
flate = "flate" # the PDF FlateDecode filter
ment = "ment" # an English suffix the synthesis grounding stemmer removes
rto = "rto" # recovery time objective, in Spec 11 recovery targets

[files]
# Sensitive-question rules list common misspellings on purpose, and the fixture uses them.
# The Well-Architected ledger copies AWS's page slugs, which the WA Tool uses as choice ids,
# misspellings included ("decomissioning", "unsucessful"); correcting them breaks the import.
extend-exclude = [
  "config/sensitive.toml",
  "crates/wt-retrieve/tests/fixtures/sensitive_questions.toml",
  "docs/well-architected/bp-ledger.csv",
]
