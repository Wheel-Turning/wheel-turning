# Practitioner question set (Spec 07, Evaluation harness): 50 questions.
#
# Questions 1 to 20 are the Gate A set (eval/gate_a_questions.toml), unchanged and in the same
# order, so their results compare across the notebook and `wt eval`.
#
# Questions 21 to 50 were written on October 11, 2026 to the PRD's coverage list: more
# multi-voice topics, single-teacher topics, grief, practice questions, the named-teacher query
# for Norman Fischer that tests thin coverage, and questions that should surface texts, with a
# named-author query for Dogen. They were loaded as drafts in practitioner@1, where the report
# showed them apart and left them out of every verdict.
#
# APPROVED by the owner on October 13, 2026: questions 21 to 50 lost their "draft" tag, unchanged
# otherwise, and the file loads as practitioner@2, since a loaded set never changes. All 50
# count toward the verdicts from version 2 on. Version 1 is this file at commit 70b2b45.
#
# Load:  wt eval load --file eval/questions_v1.toml --name practitioner --version 2

# Compassion
[[question]]
text = "I try to be compassionate toward my mother but I end up exhausted and resentful. Is that a failure of practice?"
tags = ["multi_voice", "compassion"]

[[question]]
text = "How do I practice compassion for someone who has really hurt me?"
tags = ["multi_voice", "compassion"]

# Anger
[[question]]
text = "Anger comes up hard during zazen and I can't stop replaying an argument. What do I do with it?"
tags = ["multi_voice", "anger"]

[[question]]
text = "Is it ever right to be angry, or is anger always something to let go of?"
tags = ["multi_voice", "anger"]

# Heart Sutra
[[question]]
text = "We chant 'form is emptiness, emptiness is form' every week and I still don't know what it means. How should I understand it?"
tags = ["multi_voice", "heart_sutra"]

[[question]]
text = "If there is no eye, ear, nose, tongue, body or mind, who is it that practices?"
tags = ["multi_voice", "heart_sutra"]

# Precepts
[[question]]
text = "I took the precepts but I keep breaking the one about right speech. How should I relate to that?"
tags = ["multi_voice", "precepts"]

[[question]]
text = "Are the precepts rules I follow, or something else?"
tags = ["multi_voice", "precepts"]

# Repentance
[[question]]
text = "How is the repentance verse supposed to work when I don't feel sorry, or feel sorry all the time?"
tags = ["multi_voice", "repentance"]

[[question]]
text = "I did something years ago that still makes me ashamed. Can practice help with that?"
tags = ["multi_voice", "repentance"]

