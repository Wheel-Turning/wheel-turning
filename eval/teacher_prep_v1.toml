# Teacher-prep question set, version 1 (Spec 07, Evaluation harness): DRAFTS.
#
# Owner's request of October 13, 2026: questions a Zen teacher might ask while researching their
# own dharma talk, to test whether the site helps with preparation as well as practice: how
# others have framed a koan or a Dogen passage, the stories and images they used for a theme,
# how a teaching was explained to beginners and to long-time students, which texts teachers
# cite on a topic, and where teachers differ.
#
# Claude drafted these on October 13, 2026. Each carries the tags "draft" and "teacher_prep":
# the owner must approve or replace them before their results count, and `wt eval report`
# reports draft questions apart and leaves them out of every verdict. To approve, remove the
# "draft" tag and load the file as a new version (`--version 2`), since a loaded set never
# changes.
#
# Load:  wt eval load --file eval/teacher_prep_v1.toml --name teacher_prep --version 1

# Framing a koan or a passage

[[question]]
text = "How have teachers framed the koan of Joshu's dog, Mu, for a group that has never worked with koans?"
tags = ["teacher_prep", "koans", "framing", "draft"]

[[question]]
text = "How do teachers present Hyakujo and the fox in a talk about cause and effect?"
tags = ["teacher_prep", "koans", "framing", "draft"]

[[question]]
text = "How have teachers opened up Dogen's line about the moon reflected in a drop of water?"
tags = ["teacher_prep", "dogen", "framing", "draft"]

[[question]]
text = "How do teachers explain Dogen's teaching that practice and enlightenment are one?"
tags = ["teacher_prep", "dogen", "framing", "draft"]

