[[question]]
text = "What is the point of oryoki and all the forms around eating?"
tags = ["single_teacher", "forms"]

[[question]]
text = "How do I keep practicing when work and family leave me no time to sit?"
tags = ["single_teacher", "daily_life"]

[[question]]
text = "What does shikantaza actually ask me to do on the cushion?"
