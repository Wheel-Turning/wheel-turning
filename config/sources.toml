# Sources (Spec 03). Vimeo is SSZ's canonical list (Seattle Soto Zen sources). Each Vimeo source
# names the variable holding its own account's token in `token_env` (owner's decision of
# October 13, 2026). With it set, discovery lists the account through the API and talks with no
# podcast match fetch their file through the API (route b); without it, discovery reads the
# talks page, obeying robots.txt, and asks Vimeo's oEmbed endpoint for each video.

[[source]]
name = "ssz-vimeo"
platform = "vimeo"
talks_page = "https://seattlesotozen.org/talks-page/"
token_env = "WT_SSZ_VIMEO_ACCESS_TOKEN"
default_sangha = "Seattle Soto Zen"
link_style = "vimeo"
# SSZ's talks clear on the owner's mandate when their speaker has not answered (Spec 03,
# Mandated talks; owner's decision of October 7, 2026). The key is created with
# `wt source add --kind talks --key ssz-vimeo ...`.
rights_source = "ssz-vimeo"

# Attaches audio to talks Vimeo lists and never creates a talk. The feed address is set by
# `wt source resolve-feed` after the owner confirms it.
[[source]]
name = "ssz-podcast"
platform = "rss"
default_sangha = "Seattle Soto Zen"
link_style = "none"
role = "audio_only"
feed_url = "https://feeds.feedburner.com/SeattleSotoZen"

# EngageWisdom collections (Spec 03, EngageWisdom sources; owner's decision of October 7, 2026).
# Each talk page holds its transcript and audio; discovery waits robots.txt's 10-second crawl
# delay between pages. All four are used on the owner's mandate: the keys are created with
# `wt source add --kind talks`. `max_talks` limits a collection to a sample; without it, every talk is read.
[[source]]
name = "sfzc"
platform = "engagewisdom"
# Newest first: the default order opens on the Suzuki archive's talks, which the suzuki-roshi
# source already lists under the same serials.
collection_url = "https://sfzc.engagewisdom.com/sf?search_api_views_fulltext=&order=field_date_timestamp_1&sort=desc"
default_sangha = "San Francisco Zen Center"
link_style = "engagewisdom"
default_talk_type = "dharma_talk"
rights_source = "sfzc"

[[source]]
name = "suzuki-roshi"
platform = "engagewisdom"
collection_url = "https://suzukiroshi.engagewisdom.com/sr"
default_sangha = "San Francisco Zen Center"
link_style = "engagewisdom"
default_talk_type = "dharma_talk"
rights_source = "sfzc"

[[source]]
name = "berkeleyzen"
platform = "engagewisdom"
collection_url = "https://berkeleyzen.engagewisdom.com/bz"
default_sangha = "Berkeley Zen Center"
link_style = "engagewisdom"
default_talk_type = "dharma_talk"
rights_source = "berkeleyzen"

[[source]]
name = "peacefulsea"
platform = "engagewisdom"
collection_url = "https://peacefulsea.engagewisdom.com/eb"
default_sangha = "Peaceful Sea Sangha"
link_style = "engagewisdom"
default_talk_type = "dharma_talk"
rights_source = "peacefulsea"
