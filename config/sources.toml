# Sources (Spec 03). Vimeo is SSZ's canonical list (Seattle Soto Zen sources). With
# WT_VIMEO_ACCESS_TOKEN set, discovery lists the account through the API; without it, it reads
# the talks page, obeying robots.txt, and asks Vimeo's oEmbed endpoint for each video.

[[source]]
name = "ssz-vimeo"
platform = "vimeo"
talks_page = "https://seattlesotozen.org/talks-page/"
default_sangha = "Seattle Soto Zen"
link_style = "vimeo"
# SSZ's talks clear on the owner's mandate when their speaker has not answered (Spec 03,
# Mandated talks; owner's decision of October 7, 2026). The key is created with
# `wt source add --kind talks --key ssz-vimeo ...`.
rights_source = "ssz-vimeo"

# Attaches audio to talks Vimeo lists and never creates a talk. The feed address is set by
# `wt source resolve-feed` after the owner confirms it.
[[source]]
name = "ssz-podcast"
platform = "rss"
default_sangha = "Seattle Soto Zen"
link_style = "none"
role = "audio_only"
feed_url = "https://feeds.feedburner.com/SeattleSotoZen"
