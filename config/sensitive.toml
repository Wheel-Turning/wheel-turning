# Sensitive questions (Spec 05). Read by `wt_retrieve::sensitive`. These rules run before
# retrieval and never affect ranking.
#
# Phrases are matched on word boundaries without regard to case. Apostrophes are dropped and
# other punctuation counts as a space, so "can't go on" and "cant go on" are the same phrase.
# List common misspellings as phrases of their own. The highest level any layer returns wins,
# so a phrase belongs in the most serious category it can mean: "suicidal" is acute even though
# some who write it state no intent.
#
# OWNER: review these lists, with a clinician if possible, before inviting testers. A missed
# acute phrase is the failure that matters most; a false alarm costs one notice.

# The fixed query behind the acute page's "Show teachings on facing difficult feelings".
curated_query = "How do teachers say to stay with very difficult feelings, such as fear, despair and grief, with kindness?"

[thresholds]
# Cosine similarity to the closest exemplar in config/sensitive_exemplars.toml at or above
# which the embedding layer returns the category. Calibrated on October 11, 2026 for
# bge-m3-int8 against the synthetic fixture in
# crates/wt-retrieve/tests/fixtures/sensitive_questions.toml (`cargo test -p wt-retrieve --test
# sensitive real_embedder -- --ignored --nocapture` prints every similarity). The 60 ordinary
# practice questions peaked at 0.67 for acute, 0.77 for distress and 0.74 for medical.
# Recalibrate when the model or the exemplars change.
acute_sim = 0.74
distress_sim = 0.80
medical_sim = 0.80

[model]
# The optional model layer runs only when the rules and the embedding layer disagree, and only
# while the monthly cap allows. It can raise the level and never lower it.
enabled = true
timeout_s = 5

[rules]
# Zen talks use "great death", "die before you die", "kill the Buddha", "step off the
# hundred-foot pole", "the unconscious", "old age, sickness and death" and "withdrawal" from
# the world as practice language, so bare words like those are left out on purpose and the
# embedding layer weighs them instead.
