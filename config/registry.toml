# The teacher, alias and sangha registry. Load it with:
#   wt registry import --file config/registry.toml --by "<your name>"
# Rerunning is safe: it updates fields and adds new aliases, and never removes one.
#
# Aliases are matched as whole words in talk titles, then descriptions, ignoring case. A title
# that names two teachers, or none, goes to needs_review. So an alias must name one person:
# bare "Daiho" belongs to both Steve Given and Chris Middleman, and bare "Jundo" and "Shindo"
# are too common, so only the full forms are listed. The display name is always an alias too.
#
# A teacher's sangha here is their home sangha. A talk credits the sangha where it was given,
# which receives its dana. Donation links start unverified (Spec 02, Donation links). No email
# address belongs in this file.

[[sangha]]
name = "Seattle Soto Zen"
donation_url = "https://seattlesotozen.org/make-a-donation/"

