# Exemplar sentences for the embedding layer of sensitive-question detection (Spec 05).
#
# PLACEHOLDER, NOT YET REVIEWED. Claude wrote these on October 11, 2026 so the layer could be
# built and tested. Spec 05 asks the owner to write them and, if possible, a clinician to
# review them. Until both have, `reviewed` stays false and the server logs a warning at start.
#
# Each sentence is embedded once at start. A question whose cosine similarity to its closest
# exemplar reaches the category's threshold in config/sensitive.toml gets that category. Write
# them the way a person would actually type a question, short and plain, and cover the ways a
# category shows up rather than repeating one phrasing.

