# Language-model prices for the spend cap (Spec 04), in US dollars per million tokens. Edited
# by hand: check them against https://platform.claude.com/docs/en/about-claude/pricing and move
# checked_on. A model missing here is refused, since its cost could not be estimated.
#
# `sampling` says whether the model accepts sampling settings: the client sends temperature 0
# only where it does. Claude Sonnet 5.5, Opus 5.5 and Fable 5.1 reject them (decision of
# October 5, 2026).
#
# `max_prompt_tokens` is the longest prompt the price holds for. The client refuses a longer one,
# since the table has no price for it. Claude Haiku 5.5 is priced higher above 100,000 tokens
# (Spec 11, PB2.0); its tokenizer counts about 30 percent more tokens than Haiku 4.5's for the
# same text.

checked_on = "2026-10-15"

[[model]]
id = "claude-haiku-4-5"
input_per_mtok = 1.0
output_per_mtok = 5.0
sampling = true

[[model]]
id = "claude-haiku-5-5"
input_per_mtok = 0.10
output_per_mtok = 0.50
sampling = false
max_prompt_tokens = 100000

[[model]]
id = "claude-sonnet-5-5"
input_per_mtok = 2.0
output_per_mtok = 10.0
sampling = false

[[model]]
id = "claude-opus-5-5"
input_per_mtok = 4.0
output_per_mtok = 20.0
sampling = false
