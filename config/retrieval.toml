# Retrieval, selection and answer settings (Spec 05). Numeric values are starting points to
# calibrate on the 50-question set before the first tester session. fuse_top_k and
# rerank_min_score were calibrated on the 20 Gate A questions on October 10, 2026 with the int8
# reranker on the owner's CPU (PR description has the numbers).

[retrieval]
fts_top_k = 60
vector_top_k = 60
question_top_k = 10        # student-question hits fused as a third list; a long list crowded out direct passage matches
rrf_k = 60
fuse_top_k = 60            # candidates sent to the ranker; 40 with the cross-encoder (20 dropped good passages), 60 since the model ranker scores them in parallel batches (Oct 15, 2026)
hnsw_ef_search = 1000      # halfvec index (0043): recall@60 vs exact 0.984 mean over 119 eval questions, warm p50 72 ms; ef 400 gave 0.961 (Oct 15, 2026)
rerank_min_score = 0.35    # the model ranker's score / 10: keeps 4 ("related but indirect") and up. The cross-encoder used 0.15; 0.30 cut on-topic passages
rerank_timeout_s = 5       # the model ranker's batches run side by side; the cross-encoder needed 20 and still timed out on the web service
rerank_sessions = 4        # reranker sessions side by side; each pair still runs alone, so scores do not change

[selection]
target_teachers = 3
per_teacher_cap = 3
max_passages = 10
max_sources = 8            # distinct talks in one answer
mmr_lambda = 0.7
same_talk_min_gap_s = 60   # passages closer than this in one talk count as near-duplicates
named_min_passages = 2
named_max_passages = 8
named_per_talk_cap = 2

[answer]
link_lead_in_ms = 2000
ask_rate_per_hour = 30     # per tester, in-memory token bucket (Spec 06)

[synthesis]
max_themes = 3            # sentences in each of the summary's agree and differ sections
summary_max_words = 40
quote_max_words = 60       # the quotation behind one citation marker
min_grounding_ratio = 0.2  # a coarse guard against drift; the verifier checks meaning. 0.4 dropped every sentence of honest paraphrases on the beta (Oct 15, 2026)
synthesis_timeout_s = 20   # per generation or verifier call

[excerpt]                  # Spec 05, Answer assembly, rule 8
excerpt_min_words = 25
excerpt_timeout_s = 3      # the model step, then the cross-encoder step when loaded, for all of an answer's passages at once
excerpt_max_spans = 8      # candidate spans the reranker step scores per passage
excerpt_keep_ratio = 0.9   # the shortest span scoring at least this share of the best wins

[ranking]                  # Spec 05, step 4 (owner's decision of October 15, 2026)
ranker = "model"           # "model": a Haiku-class model scores the candidates; "onnx": the cross-encoder on the CPU
batch = 10                 # candidates per model call; the calls run side by side (15 took 2.3 to 4.0 s on Gate A, Oct 15)
max_chars = 1500           # of each candidate the model sees
