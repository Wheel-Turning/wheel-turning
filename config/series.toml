# Known series (Spec 03, rule 4). Each pattern is matched, ignoring case, against the normalized
# title and needs a named capture `part`; the part may be absent from a title, in which case the
# series is recorded with no part. `parts`, when known, lets the ingest report list missing parts.

[[series]]
name = "Genjokoan"
pattern = 'genj[oō] ?k[oō]an(?:\D{0,20}?(?P<part>\d+))?'

[[series]]
name = "Uji"
pattern = '\buji\b(?:\D{0,20}?(?P<part>\d+))?'

[[series]]
name = "Bendowa"
pattern = '\bbend[oō]wa\b(?:\D{0,20}?(?P<part>\d+))?'

[[series]]
name = "Blue Cliff Record"
pattern = '\bblue cliff(?: record)?\b(?:\D{0,30}?(?P<part>\d+))?'

[[series]]
name = "Song of the Grass Hut"
pattern = '\bsong of the grass hut\b(?:\D{0,20}?(?P<part>\d+))?'
