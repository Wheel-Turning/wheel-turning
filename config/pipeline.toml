# Pipeline settings (Spec 03, Spec 04). The defaults are starting points to adjust against the
# corpus review. Title patterns are regular expressions matched, ignoring case, against the
# normalized title: NFKC, lowercase, punctuation replaced by a space, spaces collapsed. So "Q&A"
# is "q a" and "zoom_0" is "zoom 0".

[ingest]
min_talk_seconds = 300
dedupe_title_similarity = 0.6
dedupe_duration_tolerance_pct = 2
dedupe_duration_tolerance_min_s = 30
dedupe_title_identical_tolerance_s = 120
long_talk_seconds = 900
job_lock_timeout_s = 7200

# Matching podcast feed episodes to Vimeo talks (Spec 03, Seattle Soto Zen sources). Starting
# values, to tune against the real feed.
feed_match_days = 14
feed_match_duration_tolerance_s = 120
feed_match_duration_tolerance_pct = 5
feed_match_title_similarity = 0.5
feed_exact_title_days = 60

# Clips, quotes and trailers are not talks: excluded with reason non_talk.
exclude_title_patterns = ['\bquote\b', '\bclip\b', '\btrailer\b']

# Excluded by decision, whatever the consent: reason excluded_session.
exclude_session_patterns = ['\bantiracist 12 steps\b']

# Held in needs_review until a person decides, whatever the length.
review_title_patterns = [
  { pattern = '^zoom ?\d+$', reason = "untitled" },
  { pattern = '^\s*$', reason = "untitled" },
  { pattern = '\bq ?a\b|\bquestions and answers\b', reason = "student_voices" },
]

# Title patterns for talk types, first match wins. A title that says "dharma talk" is one
# whatever its length; an unmatched title is a dharma_talk only from long_talk_seconds up.
type_patterns = [
  { pattern = '\bclass\b', talk_type = "class" },
  { pattern = '\bsesshin\b|\bretreat\b', talk_type = "retreat_talk" },
  { pattern = '\bservice\b|\bceremony\b', talk_type = "service" },
  { pattern = '\bdharma talk\b', talk_type = "dharma_talk" },
]

[rights]
# How `wt source add` uses a new source when --basis is not given (Spec 08, Rights lifecycle):
# "mandate", the owner's recorded decision to rely on it, or "license" or "permission" when that
# evidence is in hand, which the command then needs as --evidence.
default_basis_for_new_sources = "mandate"

[licenses]
# License codes evidence may carry for talks and texts (Spec 03, Licensed sources; Spec 08, which
# adds public-domain). Noncommercial and no-derivatives variants stay off until counsel answers.
allowed_license_codes = ["public-domain", "permission-excerpt", "operator-mandate", "cc0", "cc-by-4.0", "cc-by-3.0", "cc-by-sa-4.0", "cc-by-sa-3.0"]

[texts]
# Texts (Spec 08, PDFs and OCR). The suspect check reads an English word list, one word to a line,
# and a PDF import is refused without one. On Linux, apt install wamerican provides the default.
# Windows has no system list: save one (such as wamerican's or SCOWL's words file) and set its
# path with forward slashes, for example word_list = "C:/tools/dict/words". A proofread passes
# with at most these errors in its random and lowest-confidence units.
word_list = "/usr/share/dict/words"
proof_random_max_errors = 1
proof_worst_max_errors = 3

[citations]
# Work-level citations (Spec 08). A citation that names a work and no place in it resolves to
# the work when a title or alias appears as whole words. These phrases come up in talks too
# often to identify a work, so they never match, even as a title or alias.
work_alias_stoplist = ["being time", "the way", "the self", "the mind", "the moon", "zazen"]

[deployment]
# Who can reach the tool. With "public" and a mandated source enabled, the audit warns, because
# a mandated source's exposure grows once the tool is public (Spec 08, Mandated sources).
exposure = "private"

[url_policy]
# URL ingestion (Spec 08): at least this long between requests to one host, the largest
# download, and hosts that republish many rights holders' works, which evidence may never cover
# host-wide.
fetch_delay_ms = 1000
max_download_mb = 200
aggregator_hosts = ["terebess.hu"]

[segment]
# Segmentation (Spec 04, Diarization and segmentation). The window thresholds are starting
# points to tune on the ten-video sample (decision of October 5, 2026). A window with no words
# is "other"; chant is slow, repetitive speech or a high share of chant phrases; talk is
# brisk, varied speech; everything else goes to the language model.
# Diarization is the slow step: "qa" diarizes only from qa_preroll_s before the transcript invites
# questions, and not at all when it reads as a monologue (at most
# monologue_max_replies_per_hour short replies); "full" diarizes every recording whole (owner's
# decision of October 8, 2026).
diarize_scope = "qa"
qa_preroll_s = 60
monologue_max_replies_per_hour = 4.0
# Student questions (Spec 04): an edit of more words, or sharing under this share of its content
# words with what the student said, is not stored.
student_question_max_words = 120
student_question_min_overlap = 0.5
multi_speaker_share = 0.35
sitting_silence_s = 120
window_s = 60
min_span_s = 20
align_nearest_ms = 500
chant_max_wpm = 60.0
chant_max_ttr = 0.35
chant_phrase_min_share = 0.30
talk_min_wpm = 90.0
talk_min_ttr = 0.35
talk_max_chant_share = 0.10
# Lines of the service chants, Japanese and English, to tune on the sample.
chant_phrases = [
    "namu kie butsu",
    "namu kie ho",
    "namu kie so",
    "maka hannya haramita shingyo",
    "kanjizai bosa gyo jin hannya haramita",
    "gya tei gya tei hara gya tei",
    "hara so gya tei bo ji sowaka",
    "ji ho san shi i shi fu",
    "shi son bu sa mo ko sa",
    "mo ko ho ja ho ro mi",
    "all buddhas throughout space and time",
    "all honored ones bodhisattva mahasattvas",
    "wisdom beyond wisdom maha prajna paramita",
    "gate gate paragate parasamgate bodhi svaha",
    "beings are numberless i vow to free them",
    "delusions are inexhaustible i vow to end them",
    "dharma gates are boundless i vow to enter them",
    "the buddha way is unsurpassable i vow to become it",
]

[chunk]
# Passages (Spec 04, Chunking, embedding and indexing).
sentence_pause_ms = 1200
target_words = 140
max_words = 220
hard_break_ms = 8000
min_words = 60
merge_cap_words = 260
boundary_max_words = 40     # longer stretches without a boundary are split for answer excerpts (Spec 04)

[asr]
# Speech recognition (Spec 04, Transcription). whisper.cpp's whisper-cli runs from
# WT_WHISPER_CLI with the model in WT_WHISPER_MODEL; large-v3 on the Vulkan build, per
# docs/asr-benchmark.md.
language = "en"
beam_size = 5
use_gpu = true
threads = 8
# Off: the glossary as whisper-cli's initial prompt made large-v3 much worse on the benchmark
# clip (docs/asr-benchmark.md, October 6, 2026). The glossary pass corrects terms afterwards.
glossary_prompt = false
# 0: each window is transcribed without the text before it. With context, large-v3 looped an
# invented sentence ten times on a synthetic talk (October 6, 2026). -1 restores whisper's
# default.
max_context = 0
