# Spec 01: runs on every pull request and every push to main. The main ruleset requires the final
# `ci ok` job, which passes only when every other job passes, so a new job is required as soon as
# it is added to its `needs` list.
#
# Third-party actions are pinned to commit SHAs; Dependabot keeps the pins current.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Compile-time checked queries build from the committed .sqlx data, not a live database.
  SQLX_OFFLINE: "true"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install  # reads rust-toolchain.toml
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install  # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rustdoc:
    name: cargo doc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A broken intra-doc link or a stray HTML tag in a doc comment fails the build.
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install  # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --no-deps --locked

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Test binaries without debug info: the workspace's debug build filled the runner's disk,
      # which killed the linker and the test database containers (October 6, 2026).
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      # The runner ships toolchains this job never uses; removing them frees about 20 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force >/dev/null
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install  # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Database tests start their own pgvector container through testcontainers, using the
      # runner's Docker. Pull once up front so the first test does not time out on the pull.
      - run: docker pull pgvector/pgvector:pg16
      # The PDF tests run poppler and Tesseract on synthetic PDFs (Spec 08, PDFs and OCR).
      # Refresh the package index first: a stale mirror list fails the fetch (October 8, 2026).
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng
      - run: cargo test --workspace --locked
        env:
          WT_REQUIRE_OCR_TOOLS: "1"

  sqlx-prepare:
    name: cargo sqlx prepare --check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wt
          POSTGRES_PASSWORD: wt
          POSTGRES_DB: wt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wt"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://wt:wt@localhost:5432/wt
      SQLX_OFFLINE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install  # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: sqlx-cli
      # Migrate with the real binary, then check the committed query data against the result.
      # The binary builds from the committed query data: its own queries name tables that do
      # not exist until it has run.
      - run: cargo run --locked -p wt-cli -- db migrate
        env:
          SQLX_OFFLINE: "true"
      - name: wt db migrate is idempotent
        run: cargo run --locked -p wt-cli -- db migrate 2>&1 | tee migrate.log && grep -q 'applied=0' migrate.log
        env:
          SQLX_OFFLINE: "true"
      - run: cargo sqlx prepare --workspace --check

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install  # reads rust-toolchain.toml
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny
      - run: cargo deny check
      - name: a payment SDK as a test dependency fails the policy
        run: bash scripts/check-deny-bans.sh

  machete:
    name: cargo machete
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete

  terraform:
    name: terraform fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.16"
      - run: terraform fmt -check -recursive infra/terraform
      - name: terraform validate every root module
        run: |
          set -euo pipefail
          for root in infra/terraform/account/ infra/terraform/bootstrap/ infra/terraform/edge/ infra/terraform/github-oidc/ infra/terraform/records/ infra/terraform/envs/*/; do
            echo "::group::$root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done
      - name: terraform test, offline against a mocked provider
        run: |
          set -euo pipefail
          for dir in infra/terraform/modules/*/; do
            [ -d "$dir/tests" ] || continue
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" test
            echo "::endgroup::"
          done

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - name: tflint every module
        working-directory: infra/terraform
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin download, avoids the anonymous rate limit
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx ruff check sidecars scripts
      - run: uvx ruff format --check sidecars scripts

  # CLAUDE.md rule 10: credentials are never committed. Scans every commit, not just the diff.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install gitleaks 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  workflows:
    name: actionlint and zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install actionlint 1.7.12
        run: |
          set -euo pipefail
          curl -sSfL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color'
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: zizmor@1.30.1
      - run: zizmor --format=github .github/workflows
        env:
          GH_TOKEN: ${{ github.token }} # online audits: known-vulnerable and impostor actions

  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: typos@1.50.3
      - run: typos --format brief

  # Spec 06, Accessibility checks in CI. Needs a browser, so it is its own job and not part of
  # `cargo test`, which makes no network calls: the a11y_fixture example serves synthetic data
  # from the Postgres service, and Playwright runs axe, target size, reflow and badge checks.
  a11y:
    name: accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wt
          POSTGRES_PASSWORD: wt
          POSTGRES_DB: wt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wt"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://wt:wt@localhost:5432/wt
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install  # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: cargo build --locked -p wt-api --example a11y_fixture
      - name: start the fixture server
        run: |
          set -euo pipefail
          ./target/debug/examples/a11y_fixture "$RUNNER_TEMP/a11y-paths.json" > "$RUNNER_TEMP/a11y-server.log" 2>&1 &
          for _ in $(seq 1 60); do
            if [[ -s "$RUNNER_TEMP/a11y-paths.json" ]] && curl -sf http://127.0.0.1:8099/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/a11y-server.log"
          exit 1
      - run: npm ci
        working-directory: tests/a11y
      - run: npx playwright install --with-deps chromium
        working-directory: tests/a11y
      - run: npx playwright test
        working-directory: tests/a11y
        env:
          A11Y_PATHS: ${{ runner.temp }}/a11y-paths.json
      - name: server log
        if: failure()
        run: cat "$RUNNER_TEMP/a11y-server.log"

  ci-ok:
    name: ci ok
    if: always()
    needs: [fmt, clippy, rustdoc, test, sqlx-prepare, deny, machete, terraform, tflint, ruff, gitleaks, workflows, typos, a11y]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::a required CI job finished with '$result'"
              exit 1
            fi
          done
