[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["tests/deny-fixture"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# internal crates
wt-core = { path = "crates/wt-core" }
wt-db = { path = "crates/wt-db" }
wt-registry = { path = "crates/wt-registry" }
wt-ingest = { path = "crates/wt-ingest" }
wt-asr = { path = "crates/wt-asr" }
wt-segment = { path = "crates/wt-segment" }
wt-index = { path = "crates/wt-index" }
wt-extract = { path = "crates/wt-extract" }
wt-ml = { path = "crates/wt-ml" }
wt-retrieve = { path = "crates/wt-retrieve" }
wt-synth = { path = "crates/wt-synth" }
wt-api = { path = "crates/wt-api" }
wt-dana = { path = "crates/wt-dana" }
wt-eval = { path = "crates/wt-eval" }

# external crates: exact versions are pinned in Cargo.lock
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

# test-only
testcontainers = "0.28"
http-body-util = "0.1"
trybuild = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
